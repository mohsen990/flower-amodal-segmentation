# AISFormer — 2-category flower dataset (buttercup + bishop of llandaff)
# Based on v2: deeper transformer, 2x invisible loss, multi-scale, 50k iters
#
# Train:
#   cd ~/flower_aistron
#   FLOWER_DATA_ROOT=~/datasets/flower_amodal_v2 \
#   /home/mohsen/det2env/bin/python3 train_net.py \
#     --config-file configs/Flower/aisformer_R50_flower_v2_2cat.yaml \
#     --num-gpus 1

_BASE_: "../KINS2020/aisformer_R50_FPN_kins2020_6ep_bs1_lowmem.yaml"

MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  BACKBONE:
    FREEZE_AT: 2
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NUM_CLASSES: 2
    BATCH_SIZE_PER_IMAGE: 16
    SCORE_THRESH_TEST: 0.05
  ROI_MASK_HEAD:
    POOLER_RESOLUTION: 28
  RPN:
    PRE_NMS_TOPK_TEST: 200
    POST_NMS_TOPK_TEST: 50

AISFORMER:
  INVISIBLE_MASK_LOSS: True
  N_LAYERS: 2
  N_HEADS: 2
  EMB_DIM: 256

INPUT:
  MASK_FORMAT: bitmask
  MIN_SIZE_TRAIN: (400, 480, 512, 544, 576, 608, 640, 672, 704, 736)
  MAX_SIZE_TRAIN: 1024
  MIN_SIZE_TEST: 400
  MAX_SIZE_TEST: 640
  RANDOM_FLIP: "horizontal"

DATASETS:
  TRAIN: ("flower_amodal_train",)
  TEST:  ("flower_amodal_val",)

DATALOADER:
  NUM_WORKERS: 2

SOLVER:
  AMP:
    ENABLED: True
  IMS_PER_BATCH: 1
  BASE_LR: 0.001
  MAX_ITER: 30000
  STEPS: (21000, 27000)
  CHECKPOINT_PERIOD: 3000
  WARMUP_ITERS: 500
  WARMUP_FACTOR: 0.001
  WEIGHT_DECAY: 0.0001

TEST:
  EVAL_PERIOD: 3000

OUTPUT_DIR: "./output/flower_aisformer_v2_2cat"
