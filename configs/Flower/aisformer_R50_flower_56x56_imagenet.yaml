# AISFormer — ImageNet pretrained + 56×56 mask head on Flower dataset
#
# Usage:
#   cd ~/flower_aistron
#   FLOWER_DATA_ROOT=/mnt/d/flower_aistron \
#   python train_net.py \
#     --config-file configs/Flower/aisformer_R50_flower_56x56_imagenet.yaml \
#     --num-gpus 1

_BASE_: "../KINS2020/aisformer_R50_FPN_kins2020_6ep_bs1_lowmem.yaml"

MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  BACKBONE:
    FREEZE_AT: 2
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NUM_CLASSES: 1                        # set to number of flower categories
    BATCH_SIZE_PER_IMAGE: 20
    SCORE_THRESH_TEST: 0.01
  ROI_MASK_HEAD:
    POOLER_RESOLUTION: 28                 # 56×56 mask output
  RPN:
    PRE_NMS_TOPK_TEST: 600
    POST_NMS_TOPK_TEST: 300

INPUT:
  MASK_FORMAT: bitmask
  MIN_SIZE_TRAIN: (400, 480, 512, 544, 576, 608, 640, 672)
  MAX_SIZE_TRAIN: 1024
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 1024

DATASETS:
  TRAIN: ("flower_amodal_train",)
  TEST:  ("flower_amodal_val",)

DATALOADER:
  NUM_WORKERS: 2

SOLVER:
  IMS_PER_BATCH: 1
  BASE_LR: 0.001
  MAX_ITER: 30000
  STEPS: (20000, 27000)
  CHECKPOINT_PERIOD: 3000
  WARMUP_ITERS: 500
  WARMUP_FACTOR: 0.001
  WEIGHT_DECAY: 0.0001

TEST:
  EVAL_PERIOD: 3000

OUTPUT_DIR: "./output/flower_aisformer"
