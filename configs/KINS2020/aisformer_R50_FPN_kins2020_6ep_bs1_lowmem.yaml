_BASE_: './Base-RCNN-FPN-KINS2020.yaml'
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  MASK_ON: True
  RESNETS:
    DEPTH: 50
  ROI_MASK_HEAD:
    NAME: AISFormer
  RPN:
    PRE_NMS_TOPK_TRAIN: 1000
    POST_NMS_TOPK_TRAIN: 500
  ROI_HEADS:
    BATCH_SIZE_PER_IMAGE: 128
AISFORMER:
  INVISIBLE_MASK_LOSS: True
  N_LAYERS: 1
  N_HEADS: 2
  EMB_DIM: 256
INPUT:
  MIN_SIZE_TRAIN: (640,)
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST: 640
  MAX_SIZE_TEST: 1333
DATALOADER:
  NUM_WORKERS: 2
